services:
    frontend:
        build: .
        command: npx serve -p 5000 services/frontend
        ports:
            - '5000:5000'
        depends_on:
            - controller

    controller:
        build: .
        command: node services/controller/index.js
        environment:
            INVENTORY_HOST: inventory:3002
            SHIPPING_HOST: shipping:3001
            REVIEWS_HOST: reviews:3003
        ports:
            - '3000:3000'
        depends_on:
            - inventory
            - shipping
            - reviews

    inventory:
        build: .
        command: node services/inventory/index.js

    shipping:
        build: .
        command: node services/shipping/index.js

    reviews:
        build: .
        command: node services/reviews/index.js
